<!doctype html><html lang="en"><head><title>Tildy — One number. Once a day.</title>
<meta name="description" content="Tildy tells you how much you can spend today, after your bills, until your next paycheck.">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
:root{--paper:#F6F2E9;--ink:#1F3D2E;--stone:#5C6B62;--rule:#DDD6C6}
@media (prefers-color-scheme:dark){:root{--paper:#121815;--ink:#EDE7D8;--stone:#A3ADA6;--rule:#2B332E}}
*{box-sizing:border-box}html{background:var(--paper)}
body{margin:0;color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:56px 28px 72px;border-left:1px solid var(--rule);min-height:100vh}
.mark,h1,h2{font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;font-weight:500;letter-spacing:-.01em}
.mark{font-size:26px;text-decoration:none;color:var(--ink)}
h1{font-size:clamp(44px,11vw,72px);line-height:1.04;margin:22vh 0 22px}
h1.small{font-size:clamp(34px,8vw,48px);margin:64px 0 8px}
h2{font-size:24px;margin:40px 0 6px}
p,li{color:var(--stone)}p.lead{font-size:19px;max-width:30em}
a{color:var(--ink)}ul{padding-left:20px}
.note{border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-top:28px}
footer{margin-top:72px;padding-top:18px;border-top:1px solid var(--rule);font-size:15px;color:var(--stone)}
footer a{margin-right:18px}
</style></head><body><main>
<a class="mark" href="/">Tildy</a>
<h1>One number.<br>Once a day.</h1>
<p class="lead">Tildy tells you how much you can spend today, after your bills, until your next paycheck.</p>
<p>Coming soon for iPhone.</p>
<footer><a href="/privacy/">Privacy</a></footer>
</main></body></html>
